name: Build Court OCR Scanner APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify source files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          grep -q "class CourtOcrApp" lib/main.dart
          grep -q "class RegisterPage" lib/main.dart
      - name: Generate Android project files if missing
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.courtocr --project-name court_ocr_scanner .
          fi
          test -f android/gradlew
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify and rename APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p /tmp/apk-output
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/apk-output/Court-OCR-Scanner.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Court-OCR-Scanner-APK
          path: /tmp/apk-output/Court-OCR-Scanner.apk
          if-no-files-found: error
          retention-days: 14
