name: Build Court OCR Scanner APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Court OCR source
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          grep -n 'class CourtOcrApp' lib/main.dart
          grep -n 'home: const RegisterPage()' lib/main.dart

      - name: Generate Android platform files if missing
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.courtocr --project-name court_ocr_scanner .
          fi

      - name: Add ML Kit Chinese recognizer dependency
        run: |
          FILE=android/app/build.gradle.kts
          if [ -f "$FILE" ] && ! grep -q 'text-recognition-chinese' "$FILE"; then
            sed -i '/^dependencies {/a\    implementation("com.google.mlkit:text-recognition-chinese:16.0.1")' "$FILE"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Court-OCR-Scanner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
