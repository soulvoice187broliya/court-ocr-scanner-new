name: Build Court OCR Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter installation
        run: flutter --version

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Configure Android SDK and ML Kit
        shell: bash
        run: |
          set -e

          # Compile the application against Android API 36
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
            android/app/build.gradle.kts

          # Supply the optional ML Kit recognizers referenced by the plugin.
          # Devanagari is needed for Hindi; the others resolve R8 missing classes.
          cat >> android/app/build.gradle.kts <<'GRADLE'

          dependencies {
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
              implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              implementation("com.google.mlkit:text-recognition-korean:16.0.1")
          }
          GRADLE

          grep -n 'compileSdk' android/app/build.gradle.kts
          tail -n 8 android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart source
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Court-OCR-Scanner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
